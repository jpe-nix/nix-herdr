name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@ffe26a1b65a00afec6a06d8001ef07896306478e # v1.40.2
    with:
      profile: nix
      all_systems: false
